<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Phrases en pictogrammes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--card:#fff;--tx:#1b2430;--mut:#64748b;--bd:#dbe3ee;--ac:#2563eb;--acx:#fff;--soft:#e8f0ff;--warn:#b45309;--sh:0 1px 2px rgba(16,24,40,.06),0 8px 22px rgba(16,24,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#1a212b;--tx:#e8edf4;--mut:#93a1b4;--bd:#2b3644;--ac:#6ea0ff;--acx:#0b1220;--soft:#1f2c44;--warn:#f0b35a;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#1a212b;--tx:#e8edf4;--mut:#93a1b4;--bd:#2b3644;--ac:#6ea0ff;--acx:#0b1220;--soft:#1f2c44;--warn:#f0b35a;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mut);font-size:.92rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:14px}
textarea{width:100%;min-height:92px;padding:12px 14px;font:inherit;font-size:1.15rem;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--ac);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:12px 0 0;color:var(--mut);font-size:.88rem}

.bar .sp{flex:1}
button{font:inherit;font-size:.92rem;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
#out{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:18px;margin-top:16px;min-height:170px}
.ln{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-start;margin-bottom:14px}
.ln.gap{height:12px;margin:0}
.c{width:var(--w,120px);background:none;border:0;border-radius:0;padding:0;text-align:center;cursor:grab;font:inherit;color:inherit;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pic{background:#fff;border:2.5px solid #cdd7e5;border-radius:18px;height:calc(var(--w,120px) * .82);display:flex;align-items:center;justify-content:center;font-size:calc(var(--w,120px) * .5);line-height:1;transition:border-color .15s,transform .15s}
.c:hover .pic{border-color:var(--ac);transform:translateY(-2px)}
.pic img{max-width:100%;max-height:100%;object-fit:contain;padding:6px;pointer-events:none}
.lbl{font-weight:700;margin-top:6px;word-break:break-word;font-size:1rem}
.c.u .pic{border-style:dashed;color:var(--warn);font-weight:700}
.c.drag{opacity:.25}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;transform:rotate(-3deg) scale(1.06);filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
#mk{position:fixed;width:5px;border-radius:3px;background:var(--ac);z-index:59;pointer-events:none;display:none}
#fs{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#fs[hidden]{display:none}
.fsbar{display:flex;gap:8px;justify-content:flex-end;padding:10px 0}
#fsout{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center}
#fsout .ln{justify-content:center}
#fsout .lbl{font-size:max(1rem,calc(var(--w,120px) * .15))}
#fsout .c{cursor:default}
button.mic-on{background:#dc2626;color:#fff;border-color:#dc2626}
.empty{color:var(--mut);padding:40px 0;text-align:center}
#saved{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
#saved span{display:inline-flex;border:1.5px solid var(--bd);border-radius:999px;background:var(--soft);overflow:hidden}
#saved button{border:0;border-radius:0;padding:5px 12px;background:none}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);padding:18px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font-size:1.1rem}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.4rem;padding:6px 10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-height:150px;overflow:auto;margin:8px 0}
.grid button{font-size:1.5rem;padding:2px;border-radius:10px}
#arg{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:190px}
#arg img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px}
.prev{font-size:64px;text-align:center;height:80px;display:flex;align-items:center;justify-content:center}
.prev img{max-height:76px;background:#fff;border-radius:10px;padding:3px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}#out{border:0;box-shadow:none;padding:0}.c{break-inside:avoid}.lbl{color:#000}}

/* ===== Design v2 ===== */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 6px 16px rgba(37,99,235,.35)}
.brand h1{margin:0;font-size:1.7rem;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.hbtn{display:flex;gap:8px}
.hbtn button{padding:6px 12px;font-size:.84rem}
.composer{padding:16px}
.lab{display:block;font-weight:700;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts button{padding:9px 15px}
button.big{padding:10px 22px;font-size:1rem;box-shadow:0 4px 12px rgba(37,99,235,.3)}
button.mic-on{box-shadow:0 0 0 4px rgba(220,38,38,.25)}
.opts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1.5px solid transparent;border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--tx);cursor:pointer}
.chip:has(input:checked){border-color:var(--ac)}
.size{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.85rem;color:var(--mut)}
.hint{color:var(--mut);font-size:.82rem;text-align:center;margin:14px 0 0}
#saved:empty{display:none}
#saved{margin:14px 0 0}
#out{background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:22px 22px}
@media (max-width:520px){main{padding:14px 10px 40px}.acts button{flex:1 1 calc(50% - 8px)}.acts .big{flex-basis:100%}.size{margin-left:0;width:100%}.brand h1{font-size:1.45rem}}
@media print{#out{background:none}}

<body>
<main>
<header class="top noprint">
<div class="brand"><div class="logo">💬</div><div><h1>Pictos</h1><p>Écrivez, voyez, montrez.</p></div></div>
<div class="hbtn"><button id="theme">🌓 Auto</button><button id="refresh">🔄 Mettre à jour</button></div>
</header>
<section class="panel noprint composer">
<label class="lab" for="in">Votre phrase</label>
<textarea id="in" class="noprint" placeholder="Ex. : Je veux manger une pomme à la maison" autofocus></textarea>
<div class="acts">
<button id="mic" class="p big">🎤 Écouter</button>
<button id="speak">🔊 Lire</button>
<button id="full">⛶ Plein écran</button>
<button id="shareimg">🖼️ Image</button>
<button id="savep">⭐ Enregistrer</button>
<button id="print">🖨️ Imprimer</button>
<button id="clear">Effacer</button>
</div>
<div class="opts">
<label class="chip"><input type="checkbox" id="cap" checked> Mots</label>
<label class="chip"><input type="checkbox" id="small"> Petits mots</label>
<label class="chip" id="genl"><input type="checkbox" id="gen" checked> Images auto</label>
<label class="size">Taille <input type="range" id="size" min="70" max="200" value="120"></label>
</div>
</section>
<div id="saved" class="noprint"></div>
<div id="out"><div class="empty">Les pictogrammes apparaîtront ici.</div></div>
<p class="hint noprint"><b>Toucher</b> un pictogramme = changer l’image · <b>Maintenir puis glisser</b> = déplacer · <b>Entrée</b> = nouvelle ligne</p>
<p class="sub noprint" id="stat" style="text-align:center"></p>
</main>

<div id="fs" hidden><div class="fsbar"><button id="fsmic">🎤 Écouter</button><button id="fsx">✕ Fermer</button></div><div id="fsout"></div></div>

<dialog id="imgd"><h2>Image de la phrase</h2>
<img id="imgp" alt="" style="width:100%;border-radius:12px;border:1px solid var(--bd);background:#fff">
<div class="row" style="justify-content:flex-end"><button id="imgs" class="p">📤 Partager</button><button id="imgv">⬇ Enregistrer</button><button id="imgx">Fermer</button></div></dialog>

<dialog id="dlg">
<h2 id="dt">Changer le pictogramme</h2>
<div class="prev" id="pv"></div>
<div class="row"><input type="text" id="emo" placeholder="Collez un emoji…" maxlength="12">
<input type="file" id="file" accept="image/*" style="display:none"><button id="up">Mon image</button><button id="gn">✨ Générer</button><button id="ar">🔎 ARASAAC</button></div>
<div class="grid" id="arg" style="display:none"></div>
<div class="grid" id="grid"></div>
<div class="row" style="justify-content:space-between">
<button id="rst">Rétablir</button>
<span><button id="no">Annuler</button> <button class="p" id="ok">Enregistrer</button></span></div>
</dialog>

<script>

// Petits mots masqués par défaut

try{custom = JSON.parse(localStorage.getItem("picto-custom")||"{}");}catch(e){custom={};}

const $ = id => document.getElementById(id);
function lookup(w){
  const k = norm(w);
  if(custom[k]) return custom[k];
  const tries=[k,k.replace(/(s|x)$/,""),k.replace(/e$/,""),k.replace(/es$/,""),k.replace(/(er|ent|ons|ez)$/,"")];
  for(const t of tries){ if(custom[t]) return custom[t]; if(libW[t]) return {t:"i",v:svgUri(wrap(LIB[libW[t]]))}; if(base[t]) return {t:"e",v:base[t]}; }
  return null;
}

  return (txt.match(/[\p{L}\p{N}-]+/gu)||[]).filter(w=>$("small").checked||!STOP.has(norm(w)));
}

function toggleMic(){

  if(!SR){ alert("La reconnaissance vocale n\u2019est pas disponible sur ce navigateur. Essayez Chrome (Android ou ordinateur)."); return; }

      alert(e.error==="network"?"Pas de connexion : la reconnaissance vocale en a besoin.":"Autorisez le micro dans votre navigateur pour utiliser cette fonction."); }

const loadImg = u => new Promise(ok=>{const i=new Image(); i.crossOrigin="anonymous"; i.onload=()=>ok(i); i.onerror=()=>ok(null); i.src=u;});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
async function makeImage(){
  const W=1400,PAD=44,CW=220,TH=180,G=26,cap=$("cap").checked,CH=TH+(cap?52:0),RG=30;
  const cols=Math.max(1,Math.floor((W-2*PAD+G)/(CW+G))), items=[]; let y=PAD;
  rows.forEach(r=>{
    if(!r.length){ y+=RG; return; }
    for(let k=0;k<r.length;k+=cols){
      const part=r.slice(k,k+cols), lw=part.length*(CW+G)-G, x0=(W-lw)/2;
      part.forEach((w,j)=>items.push({w,x:x0+j*(CW+G),y}));
      y+=CH+RG;
    }
  });
  const H=Math.max(y-RG+PAD,200);
  await Promise.all(items.map(async it=>{ it.p=lookup(it.w); it.img=(it.p&&it.p.t==="i")?await loadImg(it.p.v):null; }));
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const c=cv.getContext("2d");
  c.fillStyle="#fff"; c.fillRect(0,0,W,H); c.textAlign="center"; c.textBaseline="middle";
  items.forEach(it=>{
    const {x,y,p}=it; rr(c,x,y,CW,TH,22); c.fillStyle="#fff"; c.fill();
    c.lineWidth=4; c.strokeStyle="#cdd7e5"; c.setLineDash(p?[]:[10,8]); c.stroke(); c.setLineDash([]);
    if(it.img){ const m=14, s=Math.min((CW-2*m)/it.img.width,(TH-2*m)/it.img.height); const w=it.img.width*s,h=it.img.height*s; c.drawImage(it.img,x+(CW-w)/2,y+(TH-h)/2,w,h); }
    else if(p&&p.t==="e"){ c.font=`${TH*.55}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.fillStyle="#000"; c.fillText(p.v,x+CW/2,y+TH/2+4); }
    else { c.font="bold 34px system-ui,sans-serif"; c.fillStyle=p?"#1b2430":"#b45309"; c.fillText(p?it.w:"?",x+CW/2,y+TH/2); }
    if(cap){ c.font="bold 34px system-ui,sans-serif"; c.fillStyle="#1b2430"; c.fillText(it.w,x+CW/2,y+TH+28,CW+G-4); }
  });
  return cv;
}

let dg=null, ghost=null, tgt=null;
const mk=document.createElement("div"); mk.id="mk"; document.body.appendChild(mk);
function startDrag(){
  if(!dg||dg.on)return; dg.on=true; const c=dg.c, r=c.getBoundingClientRect();
  ghost=c.cloneNode(true); ghost.className="c ghost"; ghost.style.width=r.width+"px"; document.body.appendChild(ghost);
  dg.ox=dg.x-r.left; dg.oy=dg.y-r.top; c.classList.add("drag"); try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
  place(dg.x,dg.y);
}
function place(x,y){ghost.style.left=(x-dg.ox)+"px";ghost.style.top=(y-dg.oy)+"px";
  const h=document.elementFromPoint(x,y), tc=h&&h.closest(".c:not(.ghost)"), tl=h&&h.closest(".ln"); tgt=null; mk.style.display="none";
  if(tc&&tc!==dg.c){const q=tc.getBoundingClientRect(), before=x<q.left+q.width/2;
    tgt={r:+tc.dataset.r,i:+tc.dataset.i+(before?0:1)}; mk.style.cssText=`display:block;left:${before?q.left-8:q.right+3}px;top:${q.top}px;height:${q.height}px`;}
  else if(tc===dg.c){tgt=null;}
  else if(tl){tgt={r:+tl.dataset.r,i:rows[+tl.dataset.r].length};}
}
function endDrag(ok){
  if(!dg)return; clearTimeout(dg.t);
  if(dg.on){ if(ghost)ghost.remove(); ghost=null; mk.style.display="none"; noClick=Date.now()+450;
    if(ok&&tgt){ const [w]=rows[dg.r].splice(dg.i,1); let i=tgt.i; if(tgt.r===dg.r&&dg.i<i)i--; rows[tgt.r].splice(i,0,w); }
    render(); }
  dg=null; tgt=null;
}

const svgUri = s => "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
async function genSvg(w,ctx){
  const prompt = `Dessine un pictogramme SVG pour le mot français « ${w} »`+(ctx?` (dans la phrase : « ${ctx.slice(0,200)} »)`:"")+
  `.\nStyle pictogramme de communication adaptée (type ARASAAC) : une seule image claire et reconnaissable, formes simples et plates, couleurs vives et contrastées, contour épais foncé, centrée, fond transparent.\nContraintes : viewBox=\"0 0 100 100\", xmlns inclus, moins de 2000 caractères, AUCUN texte ni lettre, aucun script.\nRéponds uniquement avec le code SVG, sans explication ni balises markdown.`;
  const txt = await ask(prompt);
  const m = txt.match(/<svg[\s\S]*<\/svg>/i);
  if(!m) throw new Error("pas de svg");
  let s = m[0].replace(/<script[\s\S]*?<\/script>/gi,"").replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,"").replace(/<text[\s\S]*?<\/text>/gi,"").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,"");
  if(!/xmlns\s*=/.test(s)) s = s.replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"');
  return s;
}
// Recherche gratuite dans la banque ARASAAC (fonctionne sur GitHub Pages / en local)
const picUrl = id => `https://static.arasaac.org/pictograms/${id}/${id}_300.png`;
async function arasaac(w){
  for(const q of [w.toLowerCase(), w.toLowerCase().replace(/(s|x)$/,"")]){
    const r = await fetch("https://api.arasaac.org/v1/pictograms/fr/search/"+encodeURIComponent(q));
    if(!r.ok) continue;
    const j = await r.json();
    if(Array.isArray(j)&&j.length) return j.slice(0,12).map(x=>x._id);
  }
  return [];
}

// Lecture à voix haute et phrases enregistrées
$("speak").onclick = ()=>{ try{ speechSynthesis.cancel(); const t=$("in").value.trim(); if(!t)return; const u=new SpeechSynthesisUtterance(t); u.lang="fr-FR"; u.rate=.9; speechSynthesis.speak(u); }catch(e){} };
let phr=[]; try{ phr=JSON.parse(localStorage.getItem("picto-phr")||"[]"); }catch(e){}
const savePhr = ()=>{ try{ localStorage.setItem("picto-phr",JSON.stringify(phr)); }catch(e){} };
function renderPhr(){
  const s=$("saved"); s.innerHTML="";
  phr.forEach((p,i)=>{
    const w=document.createElement("span"), a=document.createElement("button"), d=document.createElement("button");
    a.textContent=p; a.onclick=()=>{$("in").value=p;render();schedule();};
    d.textContent="✕"; d.title="Supprimer"; d.onclick=()=>{phr.splice(i,1);savePhr();renderPhr();};
    w.append(a,d); s.appendChild(w);
  });
}
$("savep").onclick = ()=>{ const t=$("in").value.trim(); if(!t||phr.includes(t))return; phr.unshift(t); savePhr(); renderPhr(); };
renderPhr();
function schedule(){clearTimeout(timer);timer=setTimeout(autoGen,1200);}
function autoGen(){
  if(!$("gen").checked)return;
  words().forEach(w=>{const k=norm(w);
    if(!lookup(w)&&!pending.has(k)&&!failed.has(k)&&!queue.some(q=>q.k===k)) queue.push({w,k});});
  pump();
}
async function pump(){
  if(busy)return; busy=true;
  while(queue.length){
    const {w,k}=queue.shift(); pending.add(k); render();
    try{ custom[k]={t:"i",v:await autoPicto(w),g:1}; save(); }
    catch(e){ failed.add(k); if(e&&(e.code==="not_granted"||e.code==="rate_limited")){queue=[];pending.delete(k);break;} }
    pending.delete(k); render();
  }
  pending.clear(); busy=false; render();
}
$("in").addEventListener("input",schedule);
$("small").addEventListener("input",schedule);
$("gen").addEventListener("input",schedule);
$("gn").onclick=async()=>{
  if(!canAI())return; $("gn").disabled=true; $("gn").textContent="…";
  try{draft={t:"i",v:svgUri(await genSvg(curW,$("in").value))};prev();}catch(e){alert("Génération impossible, réessayez.");}
  $("gn").disabled=false; $("gn").textContent="✨ Générer";
};
(async()=>{
  try{ sample = window.claude ? await claude.use("sample") : null; }catch(e){ sample=null; }
  updateUI();
  schedule();
})();
$("print").onclick=()=>window.print();
$("clear").onclick=()=>{$("in").value="";render();$("in").focus();};
render();
