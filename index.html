<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrases en pictogrammes</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#d9d6cc;--ac:#2f6fed;--acx:#fff;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--tx:#ecebe6;--mut:#9aa0a8;--bd:#3a3d44;--ac:#6c9bff;--acx:#10131a;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--tx:#ecebe6;--mut:#9aa0a8;--bd:#3a3d44;--ac:#6c9bff;--acx:#10131a;--warn:#f0b35a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mut);font-size:.92rem}
textarea{width:100%;min-height:84px;padding:12px;font:inherit;font-size:1.1rem;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--ac);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:10px 0 16px;color:var(--mut);font-size:.9rem}
.bar label{display:flex;align-items:center;gap:6px}
button{font:inherit;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#out{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.c{width:var(--w,120px);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:8px 6px 6px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.c:hover{border-color:var(--ac)}
.pic{height:var(--w,120px);height:calc(var(--w,120px) * .72);display:flex;align-items:center;justify-content:center;font-size:calc(var(--w,120px) * .55);line-height:1}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.lbl{font-weight:600;margin-top:4px;word-break:break-word}
.c.u{border-style:dashed}
.c.u .pic{color:var(--warn);font-weight:700}
.empty{color:var(--mut);padding:30px 0}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:18px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:1.1rem}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.4rem;padding:6px 10px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-height:150px;overflow:auto;margin:8px 0}
.grid button{font-size:1.5rem;padding:2px}
.prev{font-size:64px;text-align:center;height:80px;display:flex;align-items:center;justify-content:center}
.prev img{max-height:76px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.c{break-inside:avoid}}
</style>
</head>
<body>
<main>
<h1>Phrases en pictogrammes</h1>
<p class="sub noprint">Écrivez une phrase ou quelques mots : chaque mot devient un pictogramme. Touchez un pictogramme pour le changer ou envoyer votre propre image.</p>
<textarea id="in" class="noprint" placeholder="Ex. : Je veux manger une pomme à la maison" autofocus></textarea>
<div class="bar noprint">
<label><input type="checkbox" id="cap" checked> Afficher les mots</label>
<label><input type="checkbox" id="small"> Petits mots (le, la, de…)</label>
<label id="genl"><input type="checkbox" id="gen" checked> Créer les images manquantes</label>
<label>Taille <input type="range" id="size" min="70" max="200" value="120"></label>
<button id="print">Imprimer</button>
<button id="clear">Effacer</button>
</div>
<div id="out"><div class="empty">Les pictogrammes apparaîtront ici.</div></div>
<p class="sub noprint" id="stat" style="margin-top:16px"></p>
</main>

<dialog id="dlg">
<h2 id="dt">Changer le pictogramme</h2>
<div class="prev" id="pv"></div>
<div class="row"><input type="text" id="emo" placeholder="Collez un emoji…" maxlength="12">
<input type="file" id="file" accept="image/*" style="display:none"><button id="up">Mon image</button><button id="gn">✨ Générer</button></div>
<div class="grid" id="grid"></div>
<div class="row" style="justify-content:space-between">
<button id="rst">Rétablir</button>
<span><button id="no">Annuler</button> <button class="p" id="ok">Enregistrer</button></span></div>
</dialog>

<script>
// Dictionnaire : pictogramme | mots (variantes et conjugaisons séparées par des virgules)
const D = `
🙋|je,moi,j,me
👉|tu,toi,te,vous
👦|il,lui
👧|elle
👫|ils,elles,eux
👨‍👩‍👧‍👦|nous,famille
👨|papa,pere,homme,monsieur
👩|maman,mere,femme,madame
👶|bebe,enfant
🧒|garcon,ami,copain
👵|mamie,grand-mere
👴|papi,grand-pere
👩‍🏫|maitresse,professeur,prof,ecole
🧑‍⚕️|docteur,medecin
✅|oui,ok,bien,d'accord
❌|non
🚫|pas,jamais,interdit
❓|quoi,comment,pourquoi,qui,quand,ou
➕|encore,plus,aussi
🤲|veux,veut,voulons,voulez,veulent,vouloir,donne,donner,donnes,donnez
🍽️|manger,mange,manges,mangeons,mangez,mangent,repas,dejeuner,diner
🥤|boire,bois,boit,buvez,boivent,boisson
😴|dormir,dors,dort,dormons,sommeil,fatigue,fatigue
🛏️|lit,coucher,couche
🚶|aller,vais,vas,va,allons,allez,vont,marcher,marche,marchons
🏃|courir,cours,court,courons,vite
🧩|jouer,joue,joues,jouons,jouent,jeu
📖|lire,lis,lit,livre,histoire
✏️|ecrire,ecris,ecrit,dessiner,dessine,dessin,crayon
👀|voir,vois,voit,voyons,regarder,regarde,regardes,regardons
👂|ecouter,ecoute,ecoutes,entendre
🗣️|parler,parle,parles,dire,dis,dit,appeler,appelle
🧼|laver,lave,laves,lavons,savon,propre
🚽|toilettes,wc,pipi,caca
🛁|bain,baigner,douche
👕|habiller,habille,vetement,tee-shirt,pull,t-shirt
👟|chaussures,chaussure,baskets
🧥|manteau,veste
🎒|sac,cartable
🏠|maison,chez,domicile,rentrer,rentre
🏫|classe,ecole
🛒|magasin,courses,acheter,achete,supermarche
🚗|voiture,auto,conduire,route
🚌|bus,autobus
🚆|train
✈️|avion,voyage
🚲|velo
🌳|arbre,parc,jardin,foret
🏖️|plage,mer,vacances
🌧️|pluie,pleut,pleuvoir
☀️|soleil,chaud,beau,jour,ete
❄️|neige,froid,hiver
🌙|nuit,soir,lune
🌅|matin
🍎|pomme,fruit
🍌|banane
🍓|fraise
🍊|orange
🍞|pain,tartine
🧀|fromage
🥛|lait
💧|eau
🧃|jus
🥕|carotte,legume,legumes
🍝|pates,spaghetti
🍚|riz
🍟|frites,pommes-de-terre
🍗|poulet,viande
🐟|poisson
🥚|oeuf,oeufs
🍫|chocolat,bonbon,bonbons
🍰|gateau,dessert
🍦|glace
🍕|pizza
🥣|soupe,bol,petit-dejeuner
🥄|cuillere
🍴|fourchette,couvert
🐶|chien
🐱|chat
🐴|cheval
🐄|vache
🐖|cochon
🐦|oiseau
🐠|poisson-rouge
🧸|peluche,doudou
⚽|ballon,foot,football
📺|television,tele,dessin-anime
📱|telephone,portable,tablette
🎵|musique,chanter,chante,chanson
🎨|peinture,peindre
😀|content,contente,heureux,joyeux,rire,rigole
😢|triste,pleurer,pleure,pleures
😠|colere,fache,fachee,enerve
😨|peur
😮|surpris,surprise
🤕|mal,blesse,douleur,bobo
🤒|malade,fievre
😋|bon,delicieux,miam
🤢|degoutant,beurk
❤️|aimer,aime,aimes,amour,adorer,adore
🙏|merci,svp,stp,s'il-te-plait,s'il-vous-plait,please
👋|bonjour,salut,coucou,bonsoir,au-revoir,aurevoir
🛑|stop,arreter,arrete,attends,attendre
🤝|aider,aide,aides,aidez
😕|comprends,comprend,comprendre
🤔|penser,pense,penses,savoir,sais,sait
🆘|aide-moi,secours
🔑|cle,ouvrir,ouvre
🚪|porte,sortir,sors,sort,entrer,entre
🪑|chaise,assis,asseoir,assieds
🛋️|canape
🍼|biberon
🛍️|cadeau
🎂|anniversaire
🎈|ballon-baudruche,fete
🕒|heure,temps,maintenant,vite
📅|demain,hier,aujourd'hui,semaine,jour
🔴|rouge
🔵|bleu
🟢|vert
🟡|jaune
⚫|noir
⚪|blanc
1️⃣|un,une,1
2️⃣|deux,2
3️⃣|trois,3
🐘|grand,gros,gros
🐜|petit,petite
⬆️|haut,monter,monte,dessus
⬇️|bas,descendre,descends,dessous
➡️|droite,suivre
⬅️|gauche
🔥|brulant,feu
🧊|glacon
🦷|dent,dents
🧠|tete,cerveau
✋|main,mains
🦶|pied,pieds
👁️|oeil,yeux
👃|nez
👄|bouche
💤|dodo
🛠️|faire,fais,fait,faisons,faites,font,bricoler
🧱|construire,construis,construit
🗑️|poubelle,jeter,jette
🌸|fleur,fleurs
🚿|se-laver
🏥|hopital
🧑‍🍳|cuisiner,cuisine,cuisines
`;
// Petits mots masqués par défaut
const STOP = new Set("le la les l un une des de du d et en au aux a à ce cet cette ces c qu que s n y t m".split(" ")
  .filter(w=>!["un","une","a","m"].includes(w)).concat(["un","une"]));
STOP.delete("un"); STOP.delete("une"); // "un/une" restent des chiffres uniquement si petits mots activés
["un","une"].forEach(w=>STOP.add(w));

const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/[’]/g,"'");
const base = {};
D.trim().split("\n").forEach(l=>{const [e,ws]=l.split("|");ws.split(",").forEach(w=>{const k=norm(w.trim());if(k&&!(k in base))base[k]=e;});});

let custom = {};
try{custom = JSON.parse(localStorage.getItem("picto-custom")||"{}");}catch(e){custom={};}
const save = ()=>{try{localStorage.setItem("picto-custom",JSON.stringify(custom));}catch(e){}};

const $ = id => document.getElementById(id);
function lookup(w){
  const k = norm(w);
  if(custom[k]) return custom[k];
  const tries=[k,k.replace(/(s|x)$/,""),k.replace(/e$/,""),k.replace(/es$/,""),k.replace(/(er|ent|ons|ez)$/,"")];
  for(const t of tries){ if(custom[t]) return custom[t]; if(base[t]) return {t:"e",v:base[t]}; }
  return null;
}
function words(){
  const txt = $("in").value.replace(/[’']/g,"' ");
  return (txt.match(/[\p{L}\p{N}-]+/gu)||[]).filter(w=>$("small").checked||!STOP.has(norm(w)));
}
function render(){
  const ws = words(), out = $("out");
  out.style.setProperty("--w",$("size").value+"px");
  if(!ws.length){out.innerHTML='<div class="empty">Les pictogrammes apparaîtront ici.</div>';$("stat").textContent="";return;}
  out.innerHTML=""; let miss=0;
  ws.forEach(w=>{
    const p=lookup(w), b=document.createElement("button");
    b.className="c"+(p?"":" u"); if(!p)miss++;
    const pic=document.createElement("div"); pic.className="pic";
    if(!p) pic.textContent=pending.has(norm(w))?"…":"?"; else if(p.t==="i"){const im=new Image();im.src=p.v;im.alt=w;pic.appendChild(im);} else pic.textContent=p.v;
    b.appendChild(pic);
    if($("cap").checked){const l=document.createElement("div");l.className="lbl";l.textContent=w;b.appendChild(l);}
    b.onclick=()=>edit(w); out.appendChild(b);
  });
  $("stat").textContent = miss ? `${miss} mot(s) sans pictogramme : touchez-les pour en ajouter un.` : "";
}
// Édition
let cur=null, curW="", draft=null;
const SUG="😀 😢 😠 😨 🤕 🍎 🍞 🥛 💧 🏠 🚗 🐶 🐱 ⚽ 📖 ✏️ 👕 👟 🛏️ 🚽 🧼 👋 🙏 ❤️ ✅ ❌ 🛑 ❓ 🕒 🌞 🌧️ 👨 👩 👶 🧸 📱 📺 🎵 🎨 🏫 🛒 🌳 🔑 🚪 🪑".split(" ");
SUG.forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>{draft={t:"e",v:e};$("emo").value=e;prev();};$("grid").appendChild(b);});
function prev(){const pv=$("pv");pv.innerHTML="";if(!draft){pv.textContent="?";return;}if(draft.t==="i"){const i=new Image();i.src=draft.v;pv.appendChild(i);}else pv.textContent=draft.v;}
function edit(w){cur=norm(w);curW=w;draft=lookup(w);$("dt").textContent="Pictogramme pour « "+w+" »";$("emo").value=draft&&draft.t==="e"?draft.v:"";prev();$("dlg").showModal();}
$("emo").oninput=e=>{const v=e.target.value.trim();draft=v?{t:"e",v}:null;prev();};
$("up").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    draft={t:"i",v:c.toDataURL("image/png")};prev();};im.src=r.result;};
  r.readAsDataURL(f); e.target.value="";
};
$("ok").onclick=()=>{if(draft)custom[cur]=draft;else delete custom[cur];save();$("dlg").close();render();};
$("rst").onclick=()=>{delete custom[cur];failed.add(cur);save();$("dlg").close();render();};
$("no").onclick=()=>$("dlg").close();
["in","cap","small","size"].forEach(i=>$(i).addEventListener("input",render));

// Génération automatique d'images (SVG dessiné par Claude) pour les mots inconnus
let sample=null, pending=new Set(), failed=new Set(), timer=null, busy=false, queue=[];
const svgUri = s => "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
async function genSvg(w,ctx){
  const prompt = `Dessine un pictogramme SVG pour le mot français « ${w} »`+(ctx?` (dans la phrase : « ${ctx.slice(0,200)} »)`:"")+
  `.\nStyle pictogramme de communication adaptée (type ARASAAC) : une seule image claire et reconnaissable, formes simples et plates, couleurs vives et contrastées, contour épais foncé, centrée, fond transparent.\nContraintes : viewBox=\"0 0 100 100\", xmlns inclus, moins de 2000 caractères, AUCUN texte ni lettre, aucun script.\nRéponds uniquement avec le code SVG, sans explication ni balises markdown.`;
  const r = await sample(prompt,{modelTier:"default",cache:false});
  const m = (r.text||"").match(/<svg[\s\S]*<\/svg>/i);
  if(!m) throw new Error("pas de svg");
  let s = m[0].replace(/<script[\s\S]*?<\/script>/gi,"").replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,"").replace(/<text[\s\S]*?<\/text>/gi,"").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,"");
  if(!/xmlns\s*=/.test(s)) s = s.replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"');
  return s;
}
function schedule(){clearTimeout(timer);timer=setTimeout(autoGen,1200);}
function autoGen(){
  if(!sample||!$("gen").checked)return;
  words().forEach(w=>{const k=norm(w);
    if(!lookup(w)&&!pending.has(k)&&!failed.has(k)&&!queue.some(q=>q.k===k)) queue.push({w,k});});
  pump();
}
async function pump(){
  if(busy)return; busy=true;
  while(queue.length){
    const {w,k}=queue.shift(); pending.add(k); render();
    try{ custom[k]={t:"i",v:svgUri(await genSvg(w,$("in").value)),g:1}; save(); }
    catch(e){ failed.add(k); if(e&&(e.code==="not_granted"||e.code==="rate_limited")){queue=[];pending.delete(k);break;} }
    pending.delete(k); render();
  }
  pending.clear(); busy=false; render();
}
$("in").addEventListener("input",schedule);
$("small").addEventListener("input",schedule);
$("gen").addEventListener("input",schedule);
$("gn").onclick=async()=>{
  if(!sample)return; $("gn").disabled=true; $("gn").textContent="…";
  try{draft={t:"i",v:svgUri(await genSvg(curW,$("in").value))};prev();}catch(e){alert("Génération impossible, réessayez.");}
  $("gn").disabled=false; $("gn").textContent="✨ Générer";
};
(async()=>{
  try{ sample = window.claude ? await claude.use("sample") : null; }catch(e){ sample=null; }
  if(!sample){ $("genl").style.display="none"; $("gn").style.display="none"; } else schedule();
})();
$("print").onclick=()=>window.print();
$("clear").onclick=()=>{$("in").value="";render();$("in").focus();};
render();
</script>
</body>
</html>
